name: Validate AI Cognitive Switchboard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate v0.1 examples
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install validation dependency
        run: python -m pip install "jsonschema>=4.18,<5"

      - name: Validate examples
        run: python scripts/validate.py
